<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Galeri foto dan suasana Café Ácala & Eatery.">
  <title>Galeri - Café Acala</title>

  <link rel="icon" href="assets/logo_acala.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Moon+Dance&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/gallery.css">
</head>
<body class="skel-aktif">

  <!-- Filter garis tepi untuk judul banner (menghilangkan garis tumpang tindih pada font Montserrat variable).
       Ketebalan garis = angka radius. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="garis-judul" x="-5%" y="-5%" width="110%" height="110%">
      <feMorphology in="SourceAlpha" operator="erode" radius="2" result="dalam"/>
      <feComposite in="SourceGraphic" in2="dalam" operator="out"/>
    </filter>
    <filter id="garis-judul-tipis" x="-5%" y="-5%" width="110%" height="110%">
      <feMorphology in="SourceAlpha" operator="erode" radius="1" result="dalam"/>
      <feComposite in="SourceGraphic" in2="dalam" operator="out"/>
    </filter>
  </svg>

  <!-- Navbar -->
  <header id="navbar" class="nav-acala"></header>

  <!-- Skeleton halaman penuh (navbar + isi + footer): tampil selama data dimuat, dilepas oleh js/skeleton.js -->
  <div id="skel-halaman" class="skel-halaman" role="status" aria-label="Memuat halaman">
    <img src="assets/skeleton_gallery.png" width="1440" height="2916" alt="" decoding="async">
  </div>

  <!-- Konten Utama -->
  <main>
    <section class="galeri-hero" aria-labelledby="galeri-judul">
      <div class="galeri-hero__bg" aria-hidden="true"></div>
      <h1 id="galeri-judul">My Gallery</h1>
    </section>

    <!-- Grid foto dirender oleh js/gallery.js -->
    <section class="galeri-area" id="galeri-area" aria-label="Galeri foto" aria-busy="true">
      <div class="galeri-grid" id="galeri-grid"></div>
    </section>
  </main>

  <!-- Popup detail foto -->
  <div class="galeri-popup" id="galeri-popup" role="dialog" aria-modal="true" aria-label="Detail foto galeri" hidden></div>

  <!-- FOOTER GLOBAL (diisi otomatis oleh js/layout.js) -->
  <footer id="footer" class="footer-section"></footer>

  <!-- Script Pendukung -->
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/skeleton.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
