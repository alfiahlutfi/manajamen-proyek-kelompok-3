<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu | Café Ácala</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

</head>
<body>
  <header id="navbar" class="nav-acala"></header>

  <main class="menu-page">

    <!-- HEADER JUDUL MENU -->

      <h1>M e n u</h1>
      <p>Racikan hangat untuk setiap suasana</p>
      <div class="garis-kuning"></div>
    </div>
    <div class="menu-layout">

      <!-- Kategori -->
      <aside>
        <ul class="kategori-list" id="kategori-list"></ul>
      </aside>

      <!-- Produk -->
      <section>
        <div class="menu-grid" id="menu-grid"></div>
        <div class="menu-pager" id="menu-pager" aria-label="Halaman menu"></div>
      </section>

    </div>
  </main>

<!-- FOOTER -->
  <footer class="footer-section">
    <div class="footer-container">

      <!-- Kolom 1: Logo Utuh Acala (logo_acala.png) -->
      <div class="footer-col footer-brand-col">
        <img src="assets/logo_acala.png" alt="Logo Café Ácala" class="footer-logo-img" loading="lazy">
      </div>

      <!-- Kolom 2: Get to Know Us -->
      <div class="footer-col">
        <h3>GET TO KNOW US</h3>
        <ul class="footer-links">
          <li><a href="menu.html">Menu</a></li>
          <li><a href="event.html">Event</a></li>
          <li><a href="gallery.html">Galeri</a></li>
          <li><a href="reservasi.html">Reservasi</a></li>
          <li><a href="faq.html">FAQ</a></li>
        </ul>
      </div>

      <!-- Kolom 3: Connect With Us (Dinamis dari Database) -->
      <div class="footer-col">
        <h3>CONNECT WITH US</h3>

        <!-- Nomor WA/HP dari DB -->
        <a id="footer-whatsapp" class="footer-contact-link" href="#" target="_blank" rel="noopener noreferrer"></a>

        <!-- Email dari DB -->
        <a id="footer-email" class="footer-contact-link" href="#"></a>

        <!-- Sosial Media dari DB -->
        <div class="footer-socials">
          <a id="footer-instagram" href="#" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <img src="assets/Instagram_logo_2022.svg.webp" alt="Instagram" loading="lazy">
          </a>
          <a id="footer-tiktok" href="#" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
            <img src="assets/tiktok-icon2.png" alt="TikTok" loading="lazy">
          </a>
        </div>
      </div>

    </div>

    <!-- Copyright -->
    <div class="footer-bottom">
      <p>© 2021-2026 Cafe Acala & Eatery</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/menu.js"></script>
