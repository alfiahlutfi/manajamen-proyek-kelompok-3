<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Café Ácala & Eatery: menu, event, reservasi, dan lokasi.">
  <title>Café Acala</title>

  <link rel="icon" href="assets/logo_acala.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap dulu, lalu CSS milik sendiri agar bisa menimpa Bootstrap -->
  <link rel="stylesheet" href="css/style.css">

</head>
<body class="beranda-page">

  <header id="navbar" class="nav-acala"></header>

  <main>

    <!-- HERO: carousel event -->
    <section class="hero skel-hero" id="event" aria-busy="true">
      <div class="hero-bg" id="hero-bg"></div>
      <div class="hero-text">
        <h1 id="hero-judul"></h1>
        <a id="hero-btn" class="btn-hijau" href="#">Lihat Detail Event</a>
      </div>
      <div class="hero-slider" id="hero-slider">
        <span class="slide-skel kiri" aria-hidden="true"></span>
        <span class="slide-skel tengah" aria-hidden="true"></span>
        <span class="slide-skel kanan" aria-hidden="true"></span>
      </div>
    </section>

    <!-- TENTANG -->
    <section class="tembok">
      <h2 class="judul-kecil" id="nama">Cafe Acala</h2>

      <!-- BUNGKUS SEMUA KONTEN ABOUT & RESERVASI -->
      <div id="konten-profil-cafe">

        <!-- ABOUT -->
        <div class="blok">
          <figure class="foto-wrap kiri">
            <img id="gambar-about"
                 src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="
                 alt="Tampak depan Café Ácala">
            <span class="lubang" aria-hidden="true"></span>
          </figure>

          <div class="blok-teks">
            <h3 id="judul-about"></h3>
            <p id="deskripsi"></p>
            <a class="btn-garis" href="menu.html">Menu</a>
          </div>
        </div>

        <!-- RESERVASI -->
        <div class="blok balik">
          <div class="blok-teks">
            <h3 id="judul-reservasi"></h3>
            <p id="deskripsi-reservasi"></p>
            <a class="btn-garis" href="reservasi.html">Reservasi</a>
          </div>

          <figure class="foto-wrap kanan">
            <img id="gambar-reservasi"
                 src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="
                 alt="Area indoor Café Ácala">
            <span class="lubang" aria-hidden="true"></span>
          </figure>
        </div>

      </div>
    </section>

    <!-- OPEN HOURS -->
    <section class="tembok jam-wrap">
      <div class="retak">
        <div class="retak-isi">
          <h2>Open Hours</h2>
          <div class="jam-grid" id="open-hours"></div>
        </div>
      </div>
    </section>

    <!-- Signature Series -->
    <div class="best-header-wrapper">
      <h2 id="best-judul">Our Signature</h2>
    </div>

    <section class="best" aria-labelledby="best-judul">
      <p>Nikmati vibe santai dengan menu andalan Acala</p>
      <div class="best-list" id="best-list" aria-busy="true">
        <div class="best-card best-skel" aria-hidden="true">
          <div class="best-skel__foto"></div>
          <div class="best-skel__teks"></div>
          <div class="best-skel__teks pendek"></div>
        </div>
        <div class="best-card best-skel" aria-hidden="true">
          <div class="best-skel__foto"></div>
          <div class="best-skel__teks"></div>
          <div class="best-skel__teks pendek"></div>
        </div>
        <div class="best-card best-skel" aria-hidden="true">
          <div class="best-skel__foto"></div>
          <div class="best-skel__teks"></div>
          <div class="best-skel__teks pendek"></div>
        </div>
        <div class="best-card best-skel" aria-hidden="true">
          <div class="best-skel__foto"></div>
          <div class="best-skel__teks"></div>
          <div class="best-skel__teks pendek"></div>
        </div>
      </div>
    </section>

    <!-- LOKASI -->
    <section class="lokasi-section">
      <div class="lokasi-container">

        <div class="lokasi-info">
            <h2>Lokasi</h2>

            <p id="alamat">
                Jl. Pasawahan, Pasawahan,
                Kec. Pasawahan, Kabupaten Kuningan,
                Jawa Barat 45559
            </p>

            <a
                id="btn-maps"
                class="btn-maps"
                href="https://www.google.com/maps/search/?api=1&query=Jl.+Pasawahan,+Pasawahan,+Kuningan,+Jawa+Barat+45559"
                target="_blank"
                rel="noopener noreferrer">
                Maps
            </a>
        </div>

        <div class="lokasi-map" id="peta-wadah">
          <div class="peta-state peta-state--memuat" id="peta-state" role="status">
            <span class="peta-loader" aria-hidden="true"><i></i><i></i></span>
            <p class="peta-state__judul">Memuat Peta</p>
            <p class="peta-state__sub">Harap Tunggu Sebentar</p>
          </div>
          <iframe
            id="peta"
            title="Lokasi Cafe Acala"
            src="about:blank"
            loading="lazy"
            allowfullscreen
            referrerpolicy="no-referrer-when-downgrade">
          </iframe>
        </div>

      </div>
    </section>

  </main>

  <!-- FOOTER GLOBAL (diisi otomatis oleh js/layout.js) -->
  <footer id="footer" class="footer-section"></footer>

<!-- Urutan penting: api -> layout (navbar) -> beranda (isi halaman). Skeleton diatur per kartu di beranda.js -->
<script src="js/offline.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/beranda.js"></script>

</body>
</html>
