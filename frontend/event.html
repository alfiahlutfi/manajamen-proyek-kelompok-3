<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Jadwal event dan kelas menarik di Café Ácala & Eatery.">
  <title>Event - Café Ácala</title>

  <link rel="icon" href="assets/logo_acala.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/event.css">
</head>
<body class="ev-page skel-aktif">

  <!-- Navbar -->
  <header id="navbar" class="nav-acala"></header>

  <!-- Skeleton halaman penuh (navbar + isi + footer): tampil selama data dimuat, dilepas oleh js/skeleton.js -->
  <div id="skel-halaman" class="skel-halaman" role="status" aria-label="Memuat halaman">
    <img src="assets/skeleton_event.png" width="1440" height="3284" alt="" decoding="async">
  </div>


  <main>
    <section class="ev-hero" aria-labelledby="ev-judul">
      <div>
        <h1 id="ev-judul">What’s On<span>at Acala?</span></h1>
        <p>Where coffee meets community, beats, and unforgettable stories.</p>
      </div>
      <div class="ev-hero-art" aria-hidden="true">
        <div class="ev-blob"></div>
        <svg class="ev-leaf a" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0 20Q50-20 100 20Q50 60 0 20Z"/><path class="vein" d="M6 20H94"/></svg>
        <svg class="ev-leaf b" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0 20Q50-20 100 20Q50 60 0 20Z"/></svg>
        <svg class="ev-leaf c" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0 20Q50-20 100 20Q50 60 0 20Z"/></svg>
        <svg class="ev-leaf d" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0 20Q50-20 100 20Q50 60 0 20Z"/></svg>
        <figure class="ev-polaroid p1"><img src="assets/duduk.jpg" alt=""></figure>
        <figure class="ev-polaroid p2"><img src="assets/acala.png" alt=""></figure>
      </div>
    </section>

    <section class="ev-section" aria-labelledby="ev-daftar">
      <h2 id="ev-daftar">MY EVENTS</h2>
      <div id="event-grid" class="ev-list" aria-live="polite" aria-busy="true"></div>
    </section>
  </main>

  <!-- FOOTER GLOBAL (diisi otomatis oleh js/layout.js) -->
  <footer id="footer" class="footer-section"></footer>

  <!-- Script Pendukung -->
  <script src="js/api.js"></script>
  <script src="js/states.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/skeleton.js"></script>
  <script src="js/event.js"></script>
</body>
</html>
